QWEN_API_MODEL: "qwen3.8-flash"

TEMPERATURE: 0.3
MODEL_MAX_RETRIES: 2
MODEL_RETRY_BASE_SECONDS: 1.0
EMPTY_CANDIDATE_RETRIES: 2

